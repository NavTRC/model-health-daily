<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>回報管理｜模型健康日報</title>
<link rel="stylesheet" href="/style.css">
<style>.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row .btn{flex:1;min-width:90px}</style>
</head>
<body>
<div class="top"><h1>回報管理（負責人）</h1><nav><a class="btn" href="/">看日報</a></nav></div>
<div class="wrap">
  <p class="note">這裡是「人看得到問題、做決定」的地方：每筆回報由負責人判斷，改成處理中、已解決或不處理。</p>
  <label>管理密碼</label>
  <div class="row"><input id="key" type="password" autocomplete="current-password"><button class="btn primary" id="go">查看</button></div>
  <div id="list"></div>
</div>
<footer>v4</footer>
<script>
const key = document.getElementById("key"), list = document.getElementById("list");
try { key.value = sessionStorage.getItem("k") || ""; } catch (e) {}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function load() {
  try { sessionStorage.setItem("k", key.value); } catch (e) {}
  const r = await fetch("/api/reports", { headers: { "x-admin-key": key.value } });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) { list.innerHTML = `<div class="card">⚠️ ${esc(j.error || "讀取失敗")}</div>`; return; }
  if (!j.items.length) { list.innerHTML = `<div class="card">目前沒有回報。</div>`; return; }
  list.innerHTML = `<p class="meta">共 ${j.items.length} 筆，新的在上面</p>` + j.items.map(it => `
    <div class="card" data-id="${esc(it.id)}">
      <div class="meta">${esc(it.id)}｜${esc(it.at.replace("T", " ").slice(0, 16))} UTC｜<b class="st">${esc(it.status)}</b></div>
      <h3 style="margin:6px 0">${esc(it.target)}｜${esc(it.kind)}</h3>
      <div>${esc(it.detail)}</div>
      <div class="note">回報人：${esc(it.who || "未填")}<span class="nt">${it.note ? "｜處理說明：" + esc(it.note) : ""}</span></div>
      <label style="margin-top:8px">處理說明（選填，先寫再按下面的狀態）</label>
      <input class="ni" maxlength="200" value="${esc(it.note || "")}" placeholder="例：已到產線確認，是換料造成的">
      <div class="row">${["處理中", "已解決", "不處理"].map(s => `<button class="btn" data-s="${s}">${s}</button>`).join("")}</div>
      <div class="meta msg"></div>
    </div>`).join("");
}
// 不用跳出視窗：處理說明寫在卡片裡，按狀態時一起送出；存好後畫面立刻改（伺服器資料約一分鐘內同步到各地）
list.addEventListener("click", async e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  const card = b.closest(".card"), id = card.dataset.id, status = b.dataset.s;
  const note = card.querySelector(".ni").value.trim(), msg = card.querySelector(".msg");
  const btns = card.querySelectorAll("button[data-s]");
  btns.forEach(x => x.disabled = true); msg.textContent = "儲存中…";
  try {
    const r = await fetch(`/api/reports/${encodeURIComponent(id)}`, { method: "POST", headers: { "x-admin-key": key.value, "content-type": "application/json" }, body: JSON.stringify({ status, note }) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { msg.textContent = "⚠️ " + (j.error || "更新失敗") + "，再按一次"; return; }
    card.querySelector(".st").textContent = status;
    card.querySelector(".nt").textContent = note ? "｜處理說明：" + note : "";
    msg.textContent = `✅ 已存成「${status}」${note ? "，含處理說明" : "（沒有填處理說明）"}。重新整理若還看到舊狀態，約一分鐘後就會同步。`;
  } catch (err) { msg.textContent = "⚠️ 連線失敗，再按一次"; }
  finally { btns.forEach(x => x.disabled = false); }
});
document.getElementById("go").onclick = load;
</script>
</body>
</html>
